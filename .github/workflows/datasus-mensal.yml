name: DATASUS/SINAN mensal

on:
  schedule:
    # Dia 5 de cada mês às 09:23 de Brasília (12:23 UTC)
    - cron: "23 12 5 * *"
  workflow_dispatch:
    inputs:
      anos:
        description: "Anos separados por vírgula (vazio = ano anterior e atual)"
        required: false
        default: ""
      doencas:
        description: "Doenças separadas por vírgula (vazio = zika,chikungunya,dengue)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::jsonlite
            any::dplyr
            any::readr
            any::tibble
            any::lubridate
            github::rfsaldanha/microdatasus

      - name: Baixar e resumir SINAN
        env:
          ANOS_DATASUS: ${{ inputs.anos }}
          DOENCAS_DATASUS: ${{ inputs.doencas }}
        run: Rscript scripts/03_atualizar_datasus.R

      - name: Salvar no repositório
        if: always()
        run: scripts/salvar_git.sh "Atualiza resumos do SINAN/DATASUS"
