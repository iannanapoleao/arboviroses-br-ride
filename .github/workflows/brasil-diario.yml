name: InfoDengue Brasil por UF (Mosqlimate, retomável)

# Roda todo dia. Cada UF atualizada fica "em dia" por 5 dias, então na prática
# cada UF é renovada uma vez por semana; o resto do tempo a execução só termina
# a carga que ficou pendente (o Mosqlimate limita muito as chamadas).
on:
  schedule:
    - cron: "41 6 * * *"   # 03:41 de Brasília
  workflow_dispatch:
    inputs:
      ano_inicial:
        description: "Garantir dados do Brasil desde este ano (vazio = ano atual)"
        required: false
        default: ""
      doencas_br:
        description: "Doenças separadas por vírgula (vazio = dengue,chikungunya,zika)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::readr
            any::tibble
            any::lubridate
            any::sf
            any::ggplot2
            any::scales
            any::geobr

      - name: Brasil por UF (Mosqlimate)
        continue-on-error: true
        timeout-minutes: 225
        env:
          MOSQLIMATE_API_KEY: ${{ secrets.MOSQLIMATE_API_KEY }}
          ANO_INICIAL: ${{ inputs.ano_inicial }}
          DOENCAS_BR: ${{ inputs.doencas_br }}
          TEMPO_MAX_MIN: "200"
        run: Rscript scripts/02_atualizar_infodengue_brasil.R

      - name: Salvar Brasil
        if: always()
        run: scripts/salvar_git.sh "Atualiza InfoDengue Brasil por UF"

      - name: Mapas
        if: always()
        continue-on-error: true
        run: Rscript scripts/04_gerar_mapas.R

      - name: Salvar mapas
        if: always()
        run: scripts/salvar_git.sh "Atualiza mapas"
