name: Publicar painel (GitHub Pages)

on:
  workflow_run:
    workflows:
      - "InfoDengue semanal (RIDE-DF)"
      - "InfoDengue Brasil por UF (semanal)"
      - "DATASUS/SINAN mensal"
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/painel.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Montar site
        run: |
          mkdir -p _site/dados
          cp -r site/* _site/
          # força o navegador a baixar a versão nova do script e do estilo
          sed -i "s/__VERSAO__/${GITHUB_SHA::7}/g" _site/index.html
          cp data/ride/infodengue_ride_semanal.csv _site/dados/ 2>/dev/null || true
          cp data/brasil/infodengue_uf_*.csv _site/dados/ 2>/dev/null || true
          cp data/ref/*.geojson _site/dados/ 2>/dev/null || true
          cp data/datasus/sinan_perfil.csv _site/dados/ 2>/dev/null || true
          ls -la _site _site/dados

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
