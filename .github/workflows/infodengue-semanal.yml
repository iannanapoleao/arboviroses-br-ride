name: InfoDengue semanal (RIDE-DF e Brasil)

on:
  schedule:
    # Toda terça às 08:17 de Brasília (11:17 UTC)
    - cron: "17 11 * * 2"
  workflow_dispatch:
    inputs:
      ano_inicial:
        description: "Carga completa do Brasil desde este ano (vazio = só as últimas semanas)"
        required: false
        default: ""
      doencas_br:
        description: "Doenças do Brasil, separadas por vírgula (vazio = dengue,chikungunya,zika)"
        required: false
        default: ""
      anos_ride:
        description: "Anos da RIDE separados por vírgula (vazio = ano anterior e atual)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: atualizar-dados
  cancel-in-progress: false

env:
  LANG: C.UTF-8
  LC_ALL: C.UTF-8

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::httr2
            any::jsonlite
            any::dplyr
            any::readr
            any::tibble
            any::lubridate
            any::sf
            any::ggplot2
            any::scales
            any::geobr

      - name: RIDE-DF (InfoDengue)
        env:
          ANOS_RIDE: ${{ inputs.anos_ride }}
        run: Rscript scripts/01_atualizar_infodengue_ride.R

      - name: Salvar RIDE-DF
        run: scripts/salvar_git.sh "Atualiza InfoDengue RIDE-DF"

      - name: Brasil por UF (Mosqlimate)
        continue-on-error: true
        timeout-minutes: 270
        env:
          MOSQLIMATE_API_KEY: ${{ secrets.MOSQLIMATE_API_KEY }}
          ANO_INICIAL: ${{ inputs.ano_inicial }}
          DOENCAS_BR: ${{ inputs.doencas_br }}
        run: Rscript scripts/02_atualizar_infodengue_brasil.R

      - name: Salvar Brasil
        if: always()
        run: scripts/salvar_git.sh "Atualiza InfoDengue Brasil por UF"

      - name: Mapas
        if: always()
        continue-on-error: true
        run: Rscript scripts/04_gerar_mapas.R

      - name: Salvar mapas
        if: always()
        run: scripts/salvar_git.sh "Atualiza mapas"
